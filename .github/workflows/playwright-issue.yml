name: Playwright E2E (manual)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '結果とスクリーンショットのリンクを投稿する Issue 番号'
        required: true
        type: number

permissions:
  contents: write
  issues: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: >-
          python -m pip install
          "Django==4.1.7"
          python-decouple
          django-environ
          dj-database-url
          whitenoise
          django-reversion
          django-import-export
          google-auth
          google-auth-oauthlib
          google-api-python-client

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        id: e2e
        continue-on-error: true
        run: npm run test:chromium

      - name: Upload screenshots and test results
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Post screenshot and result to issue
        if: always()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          screenshot="$(find test-results -type f -name '*.png' -print -quit || true)"
          outcome="${E2E_OUTCOME:-not run}"
          if [ "$outcome" = "success" ]; then
            result="成功"
          elif [ "$outcome" = "failure" ]; then
            result="失敗"
          else
            result="未実行"
          fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/playwright-issue-comment.md"

          {
            echo "### Playwright E2E: ${result}"
            echo
            echo "- 実行結果: ${outcome}"
            echo "- [ワークフロー実行ログ](${run_url})"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- [テスト成果物（動画・トレース等）をダウンロード](${ARTIFACT_URL})"
            fi
            if [ -n "$screenshot" ]; then
              echo
              echo "![Playwright screenshot](${screenshot})"
            else
              echo "- スクリーンショットは生成されませんでした。"
            fi
            echo
            echo "テスト成果物の保存期間は7日間です。"
          } > "$body_file"

          if [ -n "$screenshot" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$body_file" \
              --attach "${screenshot}#Playwright E2E screenshot"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          fi

      - name: Fail workflow if E2E failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
