name: Playwright E2E (manual)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: '結果とスクリーンショットのリンクを投稿する Issue 番号'
        required: true
        type: number

permissions:
  contents: write
  issues: write

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO_DIR: ${{ github.workspace }}/source
    steps:
      - name: Check out repository with GitHub CLI
        run: gh repo clone "$GITHUB_REPOSITORY" "$REPO_DIR"

      - name: Create Python 3.11 environment
        run: |
          "$CONDA/bin/conda" create --yes --prefix "$RUNNER_TEMP/python311" python=3.11 pip
          echo "$RUNNER_TEMP/python311/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: |
          cd "$REPO_DIR"
          python -m pip install --upgrade pip
          python -m pip install \
          "Django==4.1.7" \
          python-decouple \
          django-environ \
          dj-database-url \
          whitenoise \
          django-reversion \
          django-import-export \
          google-auth \
          google-auth-oauthlib \
          google-api-python-client

      - name: Install Node.js dependencies
        run: |
          cd "$REPO_DIR"
          npm ci

      - name: Install Chromium
        run: |
          cd "$REPO_DIR"
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        id: e2e
        continue-on-error: true
        run: |
          cd "$REPO_DIR"
          npm run test:chromium

      - name: Post screenshot and result to issue
        if: always()
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          set -euo pipefail
          cd "$REPO_DIR"
          screenshot="$(find test-results -type f -name '*.png' -print -quit || true)"
          outcome="${E2E_OUTCOME:-not run}"
          if [ "$outcome" = "success" ]; then
            result="成功"
          elif [ "$outcome" = "failure" ]; then
            result="失敗"
          else
            result="未実行"
          fi
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="${RUNNER_TEMP}/playwright-issue-comment.md"

          {
            echo "### Playwright E2E: ${result}"
            echo
            echo "- 実行結果: ${outcome}"
            echo "- [ワークフロー実行ログ](${run_url})"
            if [ -n "$screenshot" ]; then
              echo
              echo "![Playwright screenshot](${screenshot})"
            else
              echo "- スクリーンショットは生成されませんでした。"
            fi
          } > "$body_file"

          if [ -n "$screenshot" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body-file "$body_file" \
              --attach "${screenshot}#Playwright E2E screenshot"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          fi

      - name: Fail workflow if E2E failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
